# netlify.toml
[build]
  command = "mkdocs build"
  publish = "site/"
  environment = { PYTHON_VERSION = "3.13.7"}

# Netlify uses the first rule that matches, so keep this order.

# ---- Old feeds -> current RSS feed ----
[[redirects]]
  from = "/index.xml"
  to = "/feed_rss_created.xml"
  status = 301

[[redirects]]
  from = "/tags/:tag/index.xml"
  to = "/feed_rss_created.xml"
  status = 301

[[redirects]]
  from = "/categories/:cat/index.xml"
  to = "/feed_rss_created.xml"
  status = 301

[[redirects]]
  from = "/posts/index.xml"
  to = "/feed_rss_created.xml"
  status = 301

